version: '3.8'

services:
  severus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: severus-ai-app
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./app/database:/app/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
